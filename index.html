<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ear to Fretboard"><meta name="theme-color" content="#2A52D1"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Ear to Fretboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column practice app, sticky header with key + mic, fixed bottom tab bar; fretboard as the recurring visual anchor */
:root{
  --bg:#EBEFE9; --surface:#F8FAF6; --sunk:#E1E7E0; --ink:#18211D; --muted:#56655D; --line:#C9D3CB;
  --accent:#2A52D1; --accent-soft:#DCE4FB; --on-accent:#FFFFFF;
  --good:#1D8251; --good-soft:#D6EFE1; --bad:#BC3E2A; --bad-soft:#F6DDD7; --warn:#A86C12;
  --board:#2B211B; --board-2:#33271F; --fretwire:#B9B1A3; --string:#CFC6B5; --inlay:#5A4A3E;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A201C; --sunk:#232A25; --ink:#E3E9E4; --muted:#97A69D; --line:#2F3832;
  --accent:#86A2FF; --accent-soft:#232E52; --on-accent:#0C1224;
  --good:#52C78D; --good-soft:#173527; --bad:#F2806A; --bad-soft:#3D1F19; --warn:#E3AE57;
  --board:#22190F; --board-2:#2A1F15; --fretwire:#8D8578; --string:#A79E8D; --inlay:#4A3B2F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A201C; --sunk:#232A25; --ink:#E3E9E4; --muted:#97A69D; --line:#2F3832;
  --accent:#86A2FF; --accent-soft:#232E52; --on-accent:#0C1224;
  --good:#52C78D; --good-soft:#173527; --bad:#F2806A; --bad-soft:#3D1F19; --warn:#E3AE57;
  --board:#22190F; --board-2:#2A1F15; --fretwire:#8D8578; --string:#A79E8D; --inlay:#4A3B2F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.1}
h2{font-size:1.2rem;line-height:1.2}
h3{font-size:1rem;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:14px 0 0 var(--ink);margin-right:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.85rem;cursor:pointer}
.pill select{border:0;background:transparent;font-weight:600;padding:0;cursor:pointer}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.pill.blocked .dot{background:var(--bad)}
.timerbar{max-width:720px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:10px}
.timerbar .track{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.timerbar .fill{height:100%;background:var(--accent);width:0}

main{max-width:720px;margin:0 auto;padding:18px 16px 110px;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;color:var(--muted);cursor:pointer}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--accent);font-weight:600}

/* generic controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.big{min-height:54px;font-size:1.05rem;padding:12px 20px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.grow > *{flex:1}
.seg{display:flex;background:var(--sunk);border-radius:var(--r);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.field textarea{resize:vertical;min-height:70px}
.field textarea.mono{font-size:.85rem;line-height:1.35}
.hint{font-size:.82rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:min(92vw,520px);font-size:.88rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* today */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.plan li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan .mins{font-family:var(--f-mono);font-size:1.3rem;font-weight:600;line-height:1;text-align:center}
.plan .mins small{display:block;font-size:.65rem;color:var(--muted);font-weight:400;margin-top:3px}
.plan .bt{min-width:0}
.plan .bt b{display:block}
.plan .bt span{font-size:.85rem;color:var(--muted)}
.plan li.done .bt b{text-decoration:line-through;color:var(--muted)}
.plan li.done .mins{color:var(--good)}
.plan .acts{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.week{display:flex;gap:6px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
.week i{width:100%;max-width:30px;aspect-ratio:1;border-radius:7px;background:var(--sunk);display:block}
.week i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--sunk))}
.week i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--sunk))}
.week i.l3{background:var(--accent)}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:96px}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b .col{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.bars .b .col.lo{background:var(--bad)}
.bars .b .col.none{background:var(--sunk);height:100%!important}
.bars .b span{font-family:var(--f-mono);font-size:.78rem}

/* fretboard */
.fbwrap{overflow-x:auto;border-radius:10px;-webkit-overflow-scrolling:touch}
.fb{display:grid;grid-template-columns:28px repeat(13,minmax(34px,1fr));min-width:500px;background:var(--board);border-radius:10px;padding:6px 6px 0}
.fb .s{position:relative;height:30px;display:grid;place-items:center;border-left:2px solid var(--fretwire)}
.fb .s.open{border-left:0;background:var(--board-2)}
.fb .s.f1{border-left:5px solid var(--fretwire)}
.fb .s::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--sw,1px);background:var(--string);transform:translateY(-50%);opacity:.8}
.fb .sl{display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;color:var(--fretwire)}
.fb .n{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:600}
.fb .n.scale{background:#D9D0BF;color:#2B211B;opacity:.55}
.fb .n.chord{background:#F1E9D9;color:#2B211B;box-shadow:0 0 0 2px #F1E9D9}
.fb .n.root{background:#F1E9D9;color:#2B211B;box-shadow:0 0 0 2px var(--accent)}
.fb .n.target{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.fb .n.live{background:var(--good);color:#0d1a12;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 40%,transparent)}
.fb .fn{height:22px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.68rem;color:var(--fretwire);position:relative}
.fb .fn.in::after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--inlay)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}

/* ear */
.target{display:flex;align-items:center;gap:18px}
.bigdeg{font-family:var(--f-display);font-weight:800;font-size:4.6rem;line-height:.9;min-width:1.2em;text-align:center;color:var(--accent)}
.bigdeg.reveal{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-weight:600;border-radius:8px;padding:5px 10px;background:var(--sunk);min-width:38px;text-align:center}
button.chip{border:0;cursor:pointer;font-family:var(--f-mono);font-size:inherit;color:inherit}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.no{background:var(--bad-soft);color:var(--bad)}
.chip.cur{outline:2px solid var(--accent)}
.chip.dim{color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.keypad button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:60px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.keypad button b{font-family:var(--f-mono);font-size:1.25rem}
.keypad button span{font-size:.7rem;color:var(--muted)}
.keypad button.ok{background:var(--good-soft);border-color:var(--good)}
.keypad button.no{background:var(--bad-soft);border-color:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.palette button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.palette button b{font-family:var(--f-mono);font-size:1.05rem}
.palette button span{font-size:.7rem;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:2px dashed var(--line);border-radius:10px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:1.1rem}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.slot.no{border-color:var(--bad);background:var(--bad-soft)}
.slot small{font-size:.7rem;font-weight:400;color:var(--muted)}
.feedback{min-height:1.5em;font-weight:500}
.feedback.ok{color:var(--good)}
.feedback.no{color:var(--bad)}
.meter{display:flex;align-items:center;gap:14px}
.meter .nn{font-family:var(--f-display);font-weight:800;font-size:2rem;min-width:2.6em}
.meter .cent{flex:1;height:8px;border-radius:4px;background:var(--sunk);position:relative}
.meter .cent::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.meter .cent i{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--accent);left:calc(50% - 7px);transition:left .08s}
.score{display:flex;gap:16px;font-size:.85rem;color:var(--muted)}
.score b{color:var(--ink);font-family:var(--f-mono)}

/* jam */
.stage{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.nowchord{font-family:var(--f-display);font-weight:800;font-size:3.6rem;line-height:.95}
.nowchord small{display:block;font-family:var(--f-mono);font-weight:600;font-size:1rem;color:var(--muted);margin-top:6px}
.nextchord{text-align:right;color:var(--muted)}
.nextchord b{display:block;font-family:var(--f-display);font-size:1.6rem;color:var(--ink)}
.beats{display:flex;gap:8px}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--sunk);display:block}
.beats i.on{background:var(--accent)}
.beats i.on.one{background:var(--ink)}
.turn{font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.turn.call{background:var(--accent-soft);color:var(--accent)}
.turn.you{background:var(--good-soft);color:var(--good)}
.progline{display:flex;gap:6px;flex-wrap:wrap}
.progline span{font-family:var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--sunk);font-size:.85rem}
.progline span.cur{background:var(--accent);color:var(--on-accent)}
input[type=range]{width:100%;accent-color:var(--accent)}

/* songs */
.songs{display:flex;flex-direction:column;gap:10px}
.song{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.song .hd{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.song .hd h3{font-family:var(--f-display);font-weight:800;font-size:1.08rem}
.tag{font-size:.72rem;font-weight:600;border-radius:999px;padding:3px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.due{background:var(--accent-soft);color:var(--accent)}
.tag.ex{background:transparent;border:1px dashed var(--muted)}
.secs{display:flex;flex-direction:column;gap:10px}
.sec{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.sec .nm{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;min-width:60px}
.sec .ch{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.sec .ch div{display:flex;flex-direction:column;align-items:center;background:var(--sunk);border-radius:8px;padding:4px 8px;min-width:44px}
.sec .ch b{font-family:var(--f-mono);font-size:.95rem}
.sec .ch span{font-size:.72rem;color:var(--muted)}
.sec .ch .bad{background:var(--bad-soft)}
pre.tab{font-family:var(--f-mono);font-size:.8rem;line-height:1.35;background:var(--board);color:#EDE5D6;padding:12px;border-radius:10px;overflow-x:auto;margin:0}
.review{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.review .btn{flex-direction:column;gap:0;font-size:.95rem}
.review .btn small{font-weight:400;font-size:.72rem;opacity:.85}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;display:block}
.drop input{display:none}
.hist{display:flex;gap:5px;flex-wrap:wrap;min-height:34px}
.hist .chip b{display:block;font-size:.95rem}
.hist .chip span{font-size:.68rem;color:var(--muted);font-weight:400}
.time{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shape{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.shape .hd{display:flex;align-items:baseline;justify-content:space-between;width:100%;gap:6px}
.shape .hd b{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.shape .hd span{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.shape svg{width:100%;max-width:132px;height:auto;cursor:pointer}
.shape .how{font-size:.75rem;color:var(--muted);text-align:center;min-height:2.2em}
.shape .alt{min-height:32px;padding:3px 10px;font-size:.8rem}
.cd .str,.cd .fr{stroke:var(--muted);stroke-width:1}
.cd .nut{stroke:var(--ink);stroke-width:4}
.cd .dot{fill:var(--ink)}
.cd .dot.root{fill:var(--accent)}
.cd .fn{fill:var(--bg);font:600 10px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.cd .mk{fill:var(--muted);font:600 11px var(--f-mono);text-anchor:middle}
.cd .pos{fill:var(--muted);font:600 10px var(--f-mono)}
.moves{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.moves li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.moves li p{margin:2px 0 0;font-size:.88rem}
.guide summary{cursor:pointer;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary h3::after{content:" ＋";color:var(--muted);font-weight:400}
.guide[open] summary h3::after{content:" －"}
.guide .moves{gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><i></i><span>Ear to Fretboard</span></div>
    <label class="pill" title="Key used across every exercise">Key <select id="keySel" aria-label="Key"></select></label>
    <button class="pill" id="micBtn" type="button"><span class="dot"></span><span id="micTxt">Mic off</span></button>
  </div>
  <div class="timerbar" id="timerbar" hidden>
    <span class="small" id="timerLabel"></span>
    <div class="track"><div class="fill" id="timerFill"></div></div>
    <span class="mono small" id="timerLeft"></span>
    <button class="btn ghost" id="timerStop" style="min-height:32px;padding:4px 10px">Stop</button>
  </div>
</header>

<main id="main"></main>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">

    <button data-tab="ear"><svg viewBox="0 0 24 24"><path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 0"/><path d="M10 9a2 2 0 0 1 4 0"/></svg>Ear</button>

<script>
"use strict";
/* ============ MUSIC THEORY ============ */
const SHARP=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLAT=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const FLAT_KEYS=new Set([5,10,3,8,1]);
const MAJ=[0,2,4,5,7,9,11];
const DEG_LABEL=["1","b2","2","b3","3","4","#4","5","b6","6","b7","7"];
const KEY_NAMES=["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const nn=(pc,key)=>(FLAT_KEYS.has(key)?FLAT:SHARP)[((pc%12)+12)%12];
const degOf=(pc,key)=>DEG_LABEL[((pc-key)%12+12)%12];
const pcOfDeg=(d,key)=>(key+MAJ[(d-1)%7])%12;
const degSemi=d=>d===8?12:MAJ[d-1]; // 8 = the tonic an octave up
const mtof=m=>440*Math.pow(2,(m-69)/12);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ROMAN={i:0,ii:1,iii:2,iv:3,v:4,vi:5,vii:6};
function parseNumeral(tok,key){
  const m=String(tok).trim().match(/^([b#♭♯]?)(vii|vi|iv|v|iii|ii|i)(°|o|dim|maj7|m7|7|sus4|sus2|ø7?)?$/i);
  if(!m) return null;
  const acc=(m[1]==="b"||m[1]==="♭")?-1:(m[1]==="#"||m[1]==="♯")?1:0;
  const r=m[2], upper=r===r.toUpperCase();
  const deg=ROMAN[r.toLowerCase()];
  const suf=(m[3]||"").toLowerCase();
  const root=((key+MAJ[deg]+acc)%12+12)%12;
  let iv, name=acc<0?FLAT[root]:acc>0?SHARP[root]:nn(root,key); // bVI in D is Bb, not A#
  if(suf==="°"||suf==="o"||suf==="dim"){iv=[0,3,6];name+="dim";}
  else if(suf.startsWith("ø")){iv=[0,3,6,10];name+="m7b5";}
  else if(suf==="sus4"){iv=[0,5,7];name+="sus4";}
  else if(suf==="sus2"){iv=[0,2,7];name+="sus2";}
  else if(upper){iv=[0,4,7]; if(suf==="7"){iv.push(10);name+="7";} else if(suf==="maj7"){iv.push(11);name+="maj7";} else if(suf==="m7"){iv=[0,3,7,10];name+="m7";}}
  else {iv=[0,3,7];name+="m"; if(suf==="7"||suf==="m7"){iv.push(10);name+="7";} else if(suf==="maj7"){iv.push(11);name+="(maj7)";}}
  return {num:(m[1]||"").replace("♭","b").replace("♯","#")+r+(m[3]||""),root,iv,name,pcs:iv.map(x=>(root+x)%12)};
}
function parseLine(str,key){return String(str).trim().split(/[\s,|–—-]+/).filter(Boolean).map(t=>({tok:t,c:parseNumeral(t,key)}));}
function voicing(ch){
  const r=40+((ch.root-4+12)%12);
  const out=[r, r+ch.iv[2], r+12, r+12+ch.iv[1]];
  if(ch.iv[3]!=null) out.push(r+12+ch.iv[3]); else out.push(r+19);
  return out;
}
function tonicMidi(key){let t=48+key; if(t<52)t+=12; return t;}

/* ============ AUDIO ============ */
const A={
  ctx:null, master:null, cache:new Map(), noise:null,
  init(){
    if(this.ctx){ if(this.ctx.state==="suspended") this.ctx.resume(); return this.ctx; }
    const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C();
    const comp=this.ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    this.master=this.ctx.createGain(); this.master.gain.value=.9; this.master.connect(comp); comp.connect(this.ctx.destination);
    const nb=this.ctx.createBuffer(1,this.ctx.sampleRate,this.ctx.sampleRate), d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; this.noise=nb;
    return this.ctx;
  },
  get now(){return this.ctx.currentTime;},
  buf(midi){
    if(this.cache.has(midi)) return this.cache.get(midi);
    const sr=this.ctx.sampleRate, len=Math.floor(sr*2.4), N=Math.max(2,Math.round(sr/mtof(midi)));
    const b=this.ctx.createBuffer(1,len,sr), d=b.getChannelData(0), ring=new Float32Array(N);
    for(let i=0;i<N;i++) ring[i]=Math.random()*2-1;
    for(let k=0;k<2;k++) for(let i=0;i<N;i++) ring[i]=.5*(ring[i]+ring[(i+1)%N]);
    const decay=midi>70?0.994:0.997; let peak=0;
    for(let i=0;i<len;i++){const idx=i%N; const v=ring[idx]; d[i]=v; ring[idx]=decay*.5*(v+ring[(idx+1)%N]); if(Math.abs(v)>peak)peak=Math.abs(v);}
    const g=0.42/(peak||1); for(let i=0;i<len;i++) d[i]*=g;
    this.cache.set(midi,b); return b;
  },
  pluck(midi,t,vol=.6,dur=2){
    const s=this.ctx.createBufferSource(), g=this.ctx.createGain();
    s.buffer=this.buf(midi); g.gain.setValueAtTime(vol,t); g.gain.setTargetAtTime(0,t+dur,.04);
    s.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+.4);
  },
  strum(midis,t,vol=.45,dur=1.6,down=true,spread=.02){
    const arr=down?midis:[...midis].reverse();
    arr.forEach((m,i)=>this.pluck(m,t+i*spread,vol*(1-i*.06),dur));
  },
  lead(midi,t,dur,vol=1){
    this.pluck(midi,t,.9*vol,dur);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain(), lfo=this.ctx.createOscillator(), lg=this.ctx.createGain();
    o.type="triangle"; o.frequency.value=mtof(midi); lfo.frequency.value=5.2; lg.gain.value=mtof(midi)*.004;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.32*vol,t+.015); g.gain.setTargetAtTime(.2*vol,t+.05,.08); g.gain.setTargetAtTime(0,t+dur*.85,.05);
    o.connect(g); g.connect(this.master); o.start(t); lfo.start(t); o.stop(t+dur+.4); lfo.stop(t+dur+.4);
  },
  kick(t,v=.7){const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.32);},
  hiss(t,v,freq,type,dec){const s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();s.buffer=this.noise;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dec);s.connect(f);f.connect(g);g.connect(this.master);s.start(t,Math.random()*.5);s.stop(t+dec+.02);},
  hat(t,v=.1){this.hiss(t,v,7500,"highpass",.045);},
  snare(t,v=.22){this.hiss(t,v,1900,"bandpass",.14);},
  ding(ok){const t=this.now+.02; if(ok){this.pluck(84,t,.35,.6);this.pluck(88,t+.09,.35,.8);} else this.pluck(55,t,.4,.5);},
  cadence(key,t){
    ["I","IV","V","I"].forEach((n,i)=>{const c=parseNumeral(n,key); this.strum(voicing(c),t+i*.55,.4,.6);});
    return t+4*.55+.25;
  }
};

/* ============ PITCH DETECTION ============ */
let yinD=null;
function yin(buf,sr){
  const n=buf.length, half=n>>1; let rms=0;
  for(let i=0;i<n;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/n);
  if(rms<0.012) return -1;
  const tauMax=Math.min(half-2,Math.floor(sr/70)), tauMin=Math.max(2,Math.floor(sr/1100));
  if(!yinD||yinD.length<tauMax+2) yinD=new Float32Array(tauMax+2);
  const d=yinD; d[0]=1;
  for(let tau=1;tau<=tauMax+1;tau++){let s=0; for(let i=0;i<half;i++){const x=buf[i]-buf[i+tau]; s+=x*x;} d[tau]=s;}
  let run=0; for(let tau=1;tau<=tauMax+1;tau++){run+=d[tau]; d[tau]=run?d[tau]*tau/run:1;}
  let tau=-1;
  for(let t=tauMin;t<=tauMax;t++){ if(d[t]<0.15){ while(t+1<=tauMax&&d[t+1]<d[t]) t++; tau=t; break; } }
  if(tau<0) return -1;
  const x0=d[tau-1],x1=d[tau],x2=d[tau+1],den=x0+x2-2*x1;
  return sr/(den?tau+(x0-x2)/(2*den):tau);
}
function pitchInfo(f){ if(f<=0) return null; const m=69+12*Math.log2(f/440), r=Math.round(m); return {f,midi:r,pc:((r%12)+12)%12,cents:Math.round((m-r)*100)}; }
class Holder{ // fires once a pitch class is held steadily
  constructor(ms,cb){this.ms=ms;this.cb=cb;this.pc=null;this.t0=0;this.fired=false;}
  feed(info){
    const now=performance.now();
    if(!info){ if(this.pc!==null&&now-this.last>160){this.pc=null;this.fired=false;} return; }
    this.last=now;
    if(info.pc!==this.pc){this.pc=info.pc;this.t0=now;this.fired=false;return;}
    if(!this.fired&&now-this.t0>=this.ms){this.fired=true;this.cb(info);}
  }
}
const Mic={
  state:"off", an:null, buf:new Float32Array(2048), timer:null, fns:new Set(), stream:null,
  async start(silent){
    if(this.state==="on") return true;
    try{
      A.init();
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("none");
      this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      const src=A.ctx.createMediaStreamSource(this.stream); this.an=A.ctx.createAnalyser(); this.an.fftSize=2048; src.connect(this.an);
      this.state="on"; this.timer=setInterval(()=>this.tick(),50); micUI(); return true;
    }catch(e){ this.state="blocked"; micUI(); if(!silent) toast("The microphone isn't available here. Use the app at thealexgregori.github.io/ear-to-fretboard to use it. Every exercise also works by tapping."); return false; }
  },
  stop(){ clearInterval(this.timer); this.timer=null; if(this.stream) this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; this.state="off"; micUI(); this.fns.forEach(f=>f(null)); },
  tick(){ if(!this.an) return; this.an.getFloatTimeDomainData(this.buf); const info=pitchInfo(yin(this.buf,A.ctx.sampleRate)); this.fns.forEach(f=>f(info)); },
  on(fn){this.fns.add(fn); return ()=>this.fns.delete(fn);}
};

/* ============ STORAGE (private db per viewer, local fallback) ============ */
const LS="e2f.v1";
const Store={
  mode:"local", prof:null, songsCol:null,
  lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}},
  lsSet(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}},
  async init(){
    try{
      if(!window.claude||!window.claude.use) return;
      const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(!db||!user) return; const id=await user.id(); if(!id) return;
      this.prof=db.doc("data/users/"+id+"/profile"); this.songsCol=this.prof.collection("songs"); this.mode="cloud";
    }catch(e){ this.mode="local"; }
  },
  async load(){
    const local=this.lsGet()||{};
    if(this.mode!=="cloud") return {state:local.state||null,songs:local.songs||[]};
    try{
      const [p,q]=await Promise.all([this.prof.get(),this.songsCol.get()]);
      return {state:p.exists?p.data():null, songs:q.docs.map(d=>({...d.data(),id:d.id}))};
    }catch(e){ this.mode="local"; return {state:local.state||null,songs:local.songs||[]}; }
  },
  _st:null,_busy:false,_again:false,
  saveState(){ clearTimeout(this._st); this._st=setTimeout(()=>this._flushState(),1200); },
  async _flushState(){
    const body=JSON.parse(JSON.stringify(stateBody()));
    this.lsSet({...(this.lsGet()||{}),state:body,songs:SONGS});
    if(this.mode!=="cloud") return;
    if(this._busy){this._again=true;return;} this._busy=true;
    try{await this.prof.set(body);}catch(e){} this._busy=false;
    if(this._again){this._again=false;this._flushState();}
  },
  async saveSong(s){
    this.lsSet({...(this.lsGet()||{}),state:stateBody(),songs:SONGS});
    if(this.mode!=="cloud") return;
    const {id,...body}=s; try{await this.songsCol.doc(id).set(JSON.parse(JSON.stringify(body)));}catch(e){toast("That song couldn't be saved to your vault. Check your connection and try again.");}
  },
  async deleteSong(id){
    this.lsSet({...(this.lsGet()||{}),state:stateBody(),songs:SONGS});
    if(this.mode!=="cloud") return; try{await this.songsCol.doc(id).delete();}catch(e){}
  }
};

/* ============ APP STATE ============ */
const S={key:7, keyDate:null, keyHist:[], dailyKey:true, ready:false, tab:"today", stats:{deg:{},prog:{c:0,n:0},sing:{c:0,n:0},echo:{c:0,n:0}}, log:{}, plan:null, focus:null};
let SONGS=[];
const stateBody=()=>({songPick:S.songPick,songHist:S.songHist,seeded:S.seeded,key:S.key,keyDate:S.keyDate,keyHist:S.keyHist,dailyKey:S.dailyKey,stats:S.stats,log:S.log,plan:S.plan});
/* Daily key: a new easy key each day, avoiding the last few days' keys. A manual change sticks for the rest of the day. */
// The daily key rotates through the six friendliest guitar keys: C, G, D, A, E, F
const EASY_KEYS=[0,7,2,9,4,5];
function ensureDailyKey(){
  if(!S.ready||!S.dailyKey||S.keyDate===today()) return false;
  const recent=S.keyHist.slice(-3).concat([S.key]); // skip the last few days' keys
  const pool=EASY_KEYS.filter(k=>!recent.includes(k));
  S.key=pick(pool.length?pool:EASY_KEYS.filter(k=>k!==S.key));
  S.keyDate=today(); S.keyHist=S.keyHist.concat([S.key]).slice(-11);
  Store.saveState(); toast("Today's key is "+KEY_NAMES[S.key]+".");
  return true;
}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const dayStr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function addDays(ds,n){const [y,m,d]=ds.split("-").map(Number); const dt=new Date(y,m-1,d+n); return dayStr(dt);}
function logMinutes(m){const t=today(); S.log[t]=(S.log[t]||0)+m; Store.saveState();}
function recordDeg(d,ok){const s=S.stats.deg[d]||(S.stats.deg[d]={c:0,n:0}); s.n++; if(ok)s.c++; Store.saveState();}
function bump(k,ok){const s=S.stats[k]; s.n++; if(ok)s.c++; Store.saveState();}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const main=$("#main");
let cleanup=[];
function toast(msg){const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,4200);}
function micUI(){const b=$("#micBtn"); b.classList.toggle("on",Mic.state==="on"); b.classList.toggle("blocked",Mic.state==="blocked"); $("#micTxt").textContent=Mic.state==="on"?"Listening":Mic.state==="blocked"?"Mic unavailable":"Mic off"; if(VIEWS[S.tab]&&VIEWS[S.tab].onMic) VIEWS[S.tab].onMic();}
$("#micBtn").onclick=()=>{ const on=Mic.state!=="on"; if(on) Mic.start(); else Mic.stop(); try{localStorage.setItem("e2f.mic",on?"1":"0")}catch(e){} };
/* Mic on by default: start it at launch unless it was switched off by hand. Browsers keep audio paused until the first tap, so resume then. */
(function autoMic(){
  let pref=null; try{pref=localStorage.getItem("e2f.mic");}catch(e){}
  if(pref==="0") return;
  Mic.start(true);
  const wake=()=>{ if(A.ctx&&A.ctx.state==="suspended") A.ctx.resume(); if(Mic.state==="off") Mic.start(true); };
  document.addEventListener("pointerdown",wake,{once:true,capture:true});
  document.addEventListener("keydown",wake,{once:true,capture:true});
})();

/* key selector */
const keySel=$("#keySel");
keySel.innerHTML=KEY_NAMES.map((k,i)=>`<option value="${i}">${k}</option>`).join("");
keySel.onchange=()=>{S.key=+keySel.value; S.keyDate=today(); Store.saveState(); render();};

/* ============ FRETBOARD ============ */
const OPEN=[64,59,55,50,45,40], SNAME=["e","B","G","D","A","E"];
function fretboard(marks){ // marks: Map pc -> {cls,label}
  let h='<div class="fbwrap"><div class="fb" role="img" aria-label="Fretboard, frets 0 to 12">';
  OPEN.forEach((o,si)=>{
    h+=`<div class="sl">${SNAME[si]}</div>`;
    for(let f=0;f<=12;f++){
      const pc=(o+f)%12, mk=marks.get(pc);
      h+=`<div class="s${f===0?" open":""}${f===1?" f1":""}" style="--sw:${1+si*.35}px">${mk?`<span class="n ${mk.cls}">${esc(mk.label)}</span>`:""}</div>`;
    }
  });
  h+='<div></div>'; for(let f=0;f<=12;f++) h+=`<div class="fn${[3,5,7,9,12].includes(f)?" in":""}">${f}</div>`;
  return h+"</div></div>";
}
function scaleMarks(key,extra){
  const m=new Map(); MAJ.forEach((s,i)=>m.set((key+s)%12,{cls:i===0?"root":"scale",label:String(i+1)}));
  if(extra) extra.forEach((v,k)=>m.set(k,v)); return m;
}

/* ============ TIMER ============ */
const Timer={id:null,end:0,total:0,block:null,
  start(block,mins){this.stop(true); this.block=block; this.total=mins*60000; this.end=Date.now()+this.total; $("#timerbar").hidden=false; $("#timerLabel").textContent=block.title; this.id=setInterval(()=>this.tick(),500); this.tick();},
  tick(){const left=Math.max(0,this.end-Date.now()); $("#timerFill").style.width=(100-left/this.total*100)+"%"; const s=Math.ceil(left/1000); $("#timerLeft").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); if(left<=0){A.init();A.ding(true);toast(this.block.title+" done.");markBlock(this.block.id,true);this.stop(true);}},
  stop(silent){clearInterval(this.id); this.id=null; $("#timerbar").hidden=true; if(!silent&&this.block){const done=Math.round((this.total-(this.end-Date.now()))/60000); if(done>0) logMinutes(done);} this.block=null;}
};
$("#timerStop").onclick=()=>Timer.stop(false);

/* ============ TODAY ============ */
function weakest(n){
  const arr=[1,2,3,4,5,6,7,8].map(d=>{const s=S.stats.deg[d]; return {d,acc:s&&s.n>=3?s.c/s.n:null,n:s?s.n:0};});
  const known=arr.filter(a=>a.acc!==null).sort((a,b)=>a.acc-b.acc);
  if(known.length>=3) return known.slice(0,n).map(a=>a.d);
  return [4,7].slice(0,n);
}
function songsBlockDetail(){ const t=todaysSong(); return t?"Today: "+t.title+(t.artist?" · "+t.artist:""):"Add the songs you've learnt with the + button."; }
function buildPlan(len){
  const w=weakest(2), split={20:[2,4,4,3,4,3],30:[3,5,5,4,7,6],45:[4,7,8,6,11,9]}[len];
  return {date:today(),len,done:{},blocks:[
    {id:"scale",title:"Sing the scale",mins:split[0],detail:"Warm up: 1 up to 8 and back. Once with the guide, then on your own.",go:"ear:sing:scale"},
    {id:"sing",title:"Sing & Find",mins:split[1],detail:"Sing the degree, then find it on the neck.",go:"ear:sing"},
    {id:"deg",title:"Hear scale degrees",mins:split[2],detail:"Extra focus on "+w.join(" and ")+".",go:"ear:deg",focus:w},
    {id:"prog",title:"Name the progression",mins:split[3],detail:"Hear each chord as a number in the key.",go:"ear:prog"},
    {id:"jam",title:"Call and response",mins:split[4],detail:"Answer each phrase. Short ideas, leave space.",go:"jam"},
    {id:"songs",title:"Practice your songs",mins:split[5],detail:"",go:"songs",addSong:true}
  ]};
}
function markBlock(id,v){ if(!S.plan) return; const was=!!S.plan.done[id]; S.plan.done[id]=v; if(v&&!was){const b=S.plan.blocks.find(b=>b.id===id); if(b&&!(Timer.block&&Timer.block.id===id)) {} } Store.saveState(); if(S.tab==="today") render(); }
function goTo(dest,focus){ const [tab,sub,sub2]=dest.split(":"); if(tab==="ear"&&sub) EAR.mode=sub; if(tab==="ear"&&sub==="sing") SING.sub=sub2||(SING.sub==="scale"?"one":SING.sub); if(tab==="tools"&&sub) TOOLS.mode=sub; S.focus=focus||null; setTab(tab); }

const VIEWS={};
VIEWS.today={
  render(){
    if(!S.plan||S.plan.date!==today()) S.plan=buildPlan(20);

        <div class="mins">${b.mins}<small>min</small></div>
        <div class="bt"><b>${esc(b.title)}</b><span>${esc(b.id==="songs"?songsBlockDetail():b.detail)}</span></div>
        <div class="acts">
          ${b.addSong?`<button class="iconbtn" data-addsong aria-label="Add a song you've learnt"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>`:""}

function liveMeter(hideable,shown){return `<div class="panel" id="live"><div class="row" style="justify-content:space-between"><span class="label">What you're singing or playing</span><span class="row" style="gap:10px"><span class="small muted" id="liveHint"></span>${hideable?`<button class="btn ghost" id="lvToggle" style="min-height:32px;padding:3px 10px" aria-pressed="${!!shown}">${shown?"Hide notes":"Show notes"}</button>`:""}</span></div><div class="meter"><div class="nn mono" id="lvNote">–</div><div class="cent"><i id="lvCent"></i></div><div class="mono" id="lvDeg" style="min-width:3.2em;text-align:right;font-weight:600">–</div></div></div>`;}
function bindLive(onInfo,opts={}){
  const upd=()=>{const h=$("#liveHint"); if(h) h.textContent=Mic.state==="on"?"Listening":"Turn on the mic in the header to check yourself";};
  upd();

/* Sing & Find */
const SING={sub:"one",pool:"triad",target:null,revealed:false,len:3,phrase:null,pos:0,score:{c:0,n:0}};
/* Sing the scale: 1 up to 8 and back down, one note at a time at your own pace.
   The next note comes when the mic hears you sing the current one in tune, or when you tap Next note. */
const SCALE_SEQ=[1,2,3,4,5,6,7,8,7,6,5,4,3,2,1];
const SCALE={running:false,guide:true,idx:-1,hits:new Set(),result:"",quietUntil:0};
function scaleStop(){ SCALE.running=false; SCALE.idx=-1; }
function scalePlayCur(){ // play the current note (guide mode, or on request)
  if(SCALE.idx<0||SCALE.idx>=SCALE_SEQ.length) return; A.init();
  A.pluck(tonicMidi(S.key)+degSemi(SCALE_SEQ[SCALE.idx]),A.now+.03,.6,1.3);
  SCALE.quietUntil=A.now+1.4; // don't let the mic hear the app's own note
}
function scaleStart(guide){
  A.init(); scaleStop();
  SCALE.guide=guide; SCALE.running=true; SCALE.hits=new Set(); SCALE.result=""; SCALE.idx=0;
  scalePlayCur(); // on your own you still get the starting note
}
function scaleAdvance(sungInTune){
  if(!SCALE.running) return;
  if(sungInTune) SCALE.hits.add(SCALE.idx);
  SCALE.idx++;
  if(SCALE.idx>=SCALE_SEQ.length){
    const n=SCALE.hits.size, guide=SCALE.guide; scaleStop(); A.ding(true);
    if(!guide&&Mic.state==="on") bump("sing",n>=12);
    SCALE.result=guide?"Done. Now try it on your own.":Mic.state==="on"?`${n} of ${SCALE_SEQ.length} notes sung in tune.`:"Done. Turn on the mic to have each note checked.";
    render(); return;
  }
  if(SCALE.guide) scalePlayCur();
  scaleChips();
}
// tap any number to carry on from there (jumping back lets you redo the notes after it)
function scaleJump(i){
  if(!SCALE.running){ scaleStart(SCALE.guide); render(); }
  SCALE.idx=i; for(const h of [...SCALE.hits]) if(h>=i) SCALE.hits.delete(h);
  scalePlayCur(); scaleChips();
}
function scaleChips(){
  const box=$("#scaleChips"); if(!box) return;
  box.innerHTML=SCALE_SEQ.map((d,i)=>`<button type="button" class="chip ${SCALE.hits.has(i)?"ok":i<SCALE.idx?"dim":""} ${i===SCALE.idx?"cur":""}" data-sidx="${i}" aria-label="Continue from ${d}${i>7?" on the way down":""}">${d}</button>`).join("");
  const big=$("#scaleNow"); if(big) big.textContent=SCALE.running?SCALE_SEQ[SCALE.idx]:"1";
}
function scaleSingView(el,header,footer){
  const k=S.key;
  el.innerHTML=`${header}
    <div class="panel">
      <div class="target">
        <div class="bigdeg" id="scaleNow">1</div>
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <b>Sing the scale up to 8 and back down, at your own pace.</b>
          <span class="muted small">Sing each note and hold it. Tap any number to carry on from there. ${Mic.state==="on"?"When the mic hears it in tune, the next one comes up.":"Tap Next note when you've sung it."} Start with the guide notes, then try it on your own.</span>
        </div>
      </div>
      <div class="chips" id="scaleChips"></div>
      <div class="feedback ${/^15 of/.test(SCALE.result)?"ok":""}" id="scaleFb">${esc(SCALE.result)}</div>
      ${SCALE.running?`<div class="row grow"><button class="btn big" id="scaleHear">Hear this note</button><button class="btn primary big" id="scaleNext">Next note</button></div><button class="btn ghost" id="scaleStopBtn">Stop</button>`
        :`<div class="row grow"><button class="btn primary big" id="scaleGuide">Sing with guide</button><button class="btn big" id="scaleSolo">Sing on my own</button></div>`}
    </div>
    ${footer}`;
  scaleChips();
  $("#scaleChips").onclick=e=>{ const b=e.target.closest("[data-sidx]"); if(b) scaleJump(+b.dataset.sidx); };
  const g=$("#scaleGuide"); if(g) g.onclick=()=>{scaleStart(true); render();};
  const so=$("#scaleSolo"); if(so) so.onclick=()=>{scaleStart(false); render();};
  const st=$("#scaleStopBtn"); if(st) st.onclick=()=>{scaleStop(); render();};
  const nx=$("#scaleNext"); if(nx) nx.onclick=()=>scaleAdvance(false);
  const hr=$("#scaleHear"); if(hr) hr.onclick=()=>scalePlayCur();
}

function singView(el){
  const k=S.key;
  const pool=SING.pool==="triad"?[1,3,5]:[1,2,3,4,5,6,7];
  if(SING.sub==="one"&&SING.target==null) SING.target=pick(pool.filter(d=>d!==1));
  const targetPc=SING.target?pcOfDeg(SING.target,k):null;
  let marks;
  if(SING.sub==="one") marks=scaleMarks(k,SING.revealed?new Map([[targetPc,{cls:"target",label:String(SING.target)}]]):null);
  else {const ex=new Map(); if(SING.phrase&&SING.revealed) SING.phrase.forEach(d=>ex.set(pcOfDeg(d,k),{cls:"target",label:String(d)})); marks=scaleMarks(k,ex);}
  if(SING.sub==="scale"){
    const header=`<div class="row"><div class="seg" style="flex:1" role="group">${[["scale","Scale"],["one","One degree"],["echo","Echo a phrase"]].map(([v,l])=>`<button data-sub="${v}" aria-pressed="${SING.sub===v}">${l}</button>`).join("")}</div>${tonicBtnHTML(k)}</div>`;
    const cur=SCALE.running&&SCALE.idx>=0&&SCALE.idx<SCALE_SEQ.length?SCALE_SEQ[SCALE.idx]:null;

    scaleSingView(el,header,footer);

    // a note held in tune for a moment moves you on to the next one
    const hold=new Holder(350,info=>{ if(!SCALE.running||SCALE.idx<0||SCALE.idx>=SCALE_SEQ.length) return; if(info.pc===pcOfDeg(SCALE_SEQ[SCALE.idx],k)) scaleAdvance(true); });
    bindLive(info=>hold.feed(info),{quiet:()=>!!A.ctx&&A.now<SCALE.quietUntil});

    <div class="row">

      ${tonicBtnHTML(k)}
    </div>
    ${SING.sub==="one"?`
    <div class="panel">
      <div class="target">
        <div class="bigdeg ${SING.revealed?"reveal":""}" id="bigdeg">${SING.target}</div>
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <b>Sing degree ${SING.target}, then find it.</b>
          <span class="muted small">Hear the tonic first, then reach for the target. ${SING.revealed?`It is <b>${nn(targetPc,k)}</b>, shown on the neck below.`:"Hear again replays the tonic. Tap Show answer when you think you have it."}</span>
        </div>
      </div>
      ${QBUTTONS}
      <div class="row grow"><button class="btn ghost" id="check">${SING.revealed?"Play the answer":"Show answer"}</button></div>
      ${SING.revealed&&Mic.state!=="on"?`<div class="row grow"><button class="btn good" data-self="1">I had it</button><button class="btn bad" data-self="0">I was off</button></div>`:""}
      <div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="Degrees to practise">${[["triad","1 · 3 · 5"],["all","All 7"]].map(([v,l])=>`<button data-pool="${v}" aria-pressed="${SING.pool===v}">${l}</button>`).join("")}</div>
      <div class="score">Hits <b>${SING.score.c}/${SING.score.n}</b></div></div>
    </div>`:`
    <div class="panel">
      <div style="display:flex;flex-direction:column;gap:4px"><b>Listen, sing it back, then play it.</b><span class="muted small">A short phrase from the scale plays. Hum it until it's solid before you touch the guitar.</span></div>
      <div class="chips" id="phraseChips">${SING.phrase?SING.phrase.map((d,i)=>`<span class="chip ${SING.revealed?"":"dim"} ${Mic.state==="on"&&!SING.revealed?(i<SING.pos?"ok":i===SING.pos?"cur":""):""}">${SING.revealed||i<SING.pos?d:"?"}</span>`).join(""):'<span class="muted small">Press Next sound to hear the first phrase.</span>'}</div>
      <div class="row grow">
        <button class="btn primary big" id="hearBtn">Hear again</button>
        <button class="btn big" id="nextBtn">Next sound</button>
      </div>
      <div class="row grow">
        <button class="btn ghost" id="revealPh" ${SING.phrase?"":"disabled"}>Show answer</button>
      </div>
      ${SING.phrase&&SING.revealed&&Mic.state!=="on"?`<div class="row grow"><button class="btn good" data-eself="1">Got it</button><button class="btn bad" data-eself="0">Missed some</button></div>`:""}
      <div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="Phrase length">${[3,4,5].map(n=>`<button data-len="${n}" aria-pressed="${SING.len===n}">${n} notes</button>`).join("")}</div><div class="score">Phrases <b>${S.stats.echo.c}/${S.stats.echo.n}</b></div></div>
    </div>`}
    ${liveMeter()}
    <div class="panel"><div class="row" style="justify-content:space-between"><h3>Where it lives</h3><div class="legend"><span><i style="background:var(--accent)"></i>target</span><span><i style="background:#F1E9D9;box-shadow:0 0 0 2px var(--accent)"></i>tonic</span><span><i style="background:#D9D0BF"></i>scale</span></div></div>${fretboard(marks)}</div>`;
  bindTonic();
  $$("[data-sub]").forEach(b=>b.onclick=()=>{SING.sub=b.dataset.sub;SING.revealed=false;SING.phrase=null;SING.pos=0;render();});
  if(SING.sub==="one"){
    const play=()=>{A.init(); A.pluck(tonicMidi(k)+MAJ[SING.target-1],A.now+.05,.7,1.6);};
    $("#check").onclick=()=>{ if(!SING.revealed){SING.revealed=true; render();} play(); };
    $("#hearBtn").onclick=()=>{ A.init(); A.pluck(tonicMidi(k),A.now+.05,.7,1.6); };
    $("#nextBtn").onclick=()=>{ let n; do{n=pick(pool.filter(d=>d!==1));}while(n===SING.target&&pool.length>2); SING.target=n; SING.revealed=false; render(); A.init(); A.pluck(tonicMidi(k),A.now+.05,.6,1.4); };
    $$("[data-pool]").forEach(b=>b.onclick=()=>{SING.pool=b.dataset.pool;SING.target=null;SING.revealed=false;render();});
    $$("[data-self]").forEach(b=>b.onclick=()=>{const ok=b.dataset.self==="1"; SING.score.n++; if(ok)SING.score.c++; bump("sing",ok); $("#nextBtn").click();});

    });

  }

/* Degrees */
const DEG={pool:"five",len:1,q:null,ans:[],state:"idle",score:{c:0,n:0}};
function degPool(){return {three:[1,3,5,8],five:[1,2,3,4,5],all:[1,2,3,4,5,6,7,8]}[DEG.pool];}
// Today's weak-spot focus only applies to degrees inside the range you picked
function focusInPool(){ const pool=degPool(); const f=(S.focus||[]).filter(d=>pool.includes(d)); return f.length?f:null; }
function newDegQ(){
  // Focus degrees get a gentle boost (1.5x), and no note is ever played twice in a row, even across questions.
  const pool=degPool(), f=focusInPool()||[], q=[];
  let prev=DEG.prevNote??null;
  for(let i=0;i<DEG.len;i++){
    const cands=pool.filter(x=>x!==prev||pool.length<2), w=cands.map(x=>f.includes(x)?1.5:1);
    let r=Math.random()*w.reduce((a,b)=>a+b,0), d=cands[cands.length-1];
    for(let j=0;j<cands.length;j++){ r-=w[j]; if(r<=0){ d=cands[j]; break; } }
    q.push(d); prev=d;
  }
  DEG.prevNote=prev; DEG.q=q; DEG.ans=[]; DEG.state="ask";
}
function playDegQ(withCad=true){ A.init(); let t=A.now+.08; if(withCad) t=A.cadence(S.key,t); const T=tonicMidi(S.key); DEG.q.forEach((d,i)=>A.pluck(T+degSemi(d),t+i*.6,.75,1.2)); DEG.quietUntil=t+(DEG.q.length-1)*.6+1.3; }
DEG.quietUntil=0;
try{DEG.show=localStorage.getItem("e2f.degShow")==="1";}catch(e){DEG.show=false;}
function degView(el){
  const k=S.key;
  el.innerHTML=`
    <div class="panel">
      <div style="display:flex;flex-direction:column;gap:4px"><b>A cadence sets the key, then a note plays. Which degree is it?</b><span class="muted small">Answer on the keypad, or play it on the guitar with the mic on.${focusInPool()?` Today's focus: ${focusInPool().join(" and ")}.`:""}</span></div>
      ${QBUTTONS}
      <div class="row grow"><button class="btn ghost" id="dNote" ${DEG.q?"":"disabled"}>Hear the note without the cadence</button></div>
      <div class="chips" id="dSlots">${(DEG.q||Array(DEG.len).fill(null)).map((d,i)=>{const a=DEG.ans[i]; const cls=a==null?(i===DEG.ans.length&&DEG.state==="ask"?"cur":"dim"):(a===d?"ok":"no"); return `<span class="chip ${cls}">${a!=null?a:"?"}${DEG.state==="done"&&a!==d?` → ${d}`:""}</span>`;}).join("")}</div>

/* How each chord move feels. Specific notes for the common moves; anything else is described from the root motion and the target chord's character. */

  "I>IV":"Lifts off. Home opens up, like stepping outside into daylight.",
  "I>V":"Builds tension. You leave home and immediately feel the pull back.",

  "IV>I":"Settles back down softly. The 'amen' ending: a gentle landing, not a dramatic one.",

  "IV>ii":"The brightness turns inward. Same family, softer colour.",
  "IV>iii":"Steps down into a bittersweet in-between place.",
  "IV>bVII":"Steps up outside the key. Rock-flavoured and open.",
  "IV>bVI":"Steps down into a darker, borrowed colour. Moody and dramatic.",
  "V>I":"The big resolution. Tension releases and you land home.",
  "V>vi":"The deceptive move: you expect home and get its sad twin instead.",
  "V>IV":"Backs off the tension. A relaxed, bluesy step down.",
  "V>ii":"Pulls back from the edge into something soft. The tension is postponed, not solved.",
  "V>iii":"Drifts sideways. Tension fades into a hazy, unresolved colour.",
  "V>bVI":"Swerves up into a dramatic borrowed chord. Surprising and epic.",
  "vi>IV":"Rises out of the minor into openness. Hopeful.",
  "vi>V":"Climbs from sadness into tension that wants to resolve.",
  "vi>ii":"Strong forward pull between two minor chords. Keeps the momentum going.",
  "vi>I":"Brightens back to home, like clouds clearing.",
  "vi>iii":"Sinks a little deeper into the minor mood.",
  "ii>V":"The classic setup. A soft minor that leans hard into tension.",
  "ii>I":"A soft step down to home. Gentle landing.",
  "ii>IV":"Brightens. Mostly the same notes, but it opens up.",
  "ii>iii":"Climbs a step and stays in the shadows. Restless.",

  "iii>vi":"A strong forward pull, falling deeper into the minor.",

  "iii>I":"Settles home through a close neighbour. Quiet resolution.",

  "bVII>IV":"A rock cascade stepping down by fourths. Big and open.",

  "bVI>bVII":"A heroic climb. Each step rises and the payoff is coming.",
  "bVI>I":"A dramatic, almost spiritual return home.",

};
function moveFeel(a,b){
  const key=a.replace(/7|maj7|°|ø7?/g,"")+">"+b.replace(/7|maj7|°|ø7?/g,"");
  if(MOVE_FEEL[key]) return MOVE_FEEL[key];
  const ca=parseNumeral(a,0), cb=parseNumeral(b,0); if(!ca||!cb) return "";
  const up=((cb.root-ca.root)%12+12)%12;
  const motion={0:"Stays on the same root but changes colour",1:"Rises a half step",2:"Steps up",3:"Rises a third",4:"Rises a third",5:"Moves up a fourth, a strong forward push",6:"Jumps across the key",7:"Drops a fourth",8:"Falls a third",9:"Falls a third",10:"Steps down",11:"Slips down a half step"}[up];
  const fb=CHORD_FEEL[b.replace(/7|maj7|°|ø7?/g,"")];
  return motion+" to "+b+(fb?", "+fb+".":".");
}
function movesHTML(nums,key){

  return `<ul class="moves">${out.join("")}</ul>`;
}

const PRESETS=[["Pop four","I V vi IV"],["Doo-wop","I vi IV V"],["Rock","I IV V IV"],["Jazz turnaround","ii7 V7 Imaj7 Imaj7"],["Folk","I IV I V"],["Minor feel","vi IV I V"],["Mixolydian","I bVII IV I"],["12-bar blues","I7 I7 I7 I7 IV7 IV7 I7 I7 V7 IV7 I7 V7"]];
const JAM={band:.55,lead:1,prog:"I V vi IV",bpm:84,mode:"call",phrase:null,running:false,next:0,beat:0,timer:null,events:[],raf:0,cur:-1,inKey:{c:0,n:0},last:null};

function jamChords(){return parseLine(JAM.prog,S.key).filter(x=>x.c).map(x=>x.c);}
function jamStart(){
  A.init(); const ch=jamChords(); if(!ch.length){toast("Type at least one chord as a number, like I IV V.");return;}

/* Modes: "call" = phrase, then 2 bars to answer. "singplay" = phrase, sing it back, same phrase again, play it back (8 bars). "free" = no phrases. */
const JAM_MODES=[["call","Call and response"],["singplay","Sing, then play"],["free","Free jam"]];
const JAM_LABEL={call:["Listen","call"],you:["Your turn","you"],sing:["Sing it","you"],play:["Play it","you"],free:["Jam",""]};
function jamPhase(bar){
  if(JAM.mode==="call") return Math.floor(bar/2)%2===0?"call":"you";
  if(JAM.mode==="singplay") return ["call","sing","call","play"][Math.floor(bar/2)%4];
  return "free";
}
function genJamPhrase(){ // positions in eighth notes across two bars, and scale-degree steps in the major pentatonic
  const degs=[1,2,3,5,6];
  let pos=[0]; const n=4+rnd(3); while(pos.length<n){const p=1+rnd(11); if(!pos.includes(p)) pos.push(p);} pos.sort((a,b)=>a-b);
  let di=rnd(3), oct=0; return pos.map(p=>{ di+=pick([-1,-1,1,1,2,-2,0]); if(di<0){di+=5;oct--;} if(di>4){di-=5;oct++;} oct=Math.max(-1,Math.min(0,oct)); return {p,oct,deg:degs[di]}; });
}
function callPhrase(t,fresh){
  if(fresh||!JAM.phrase) JAM.phrase=genJamPhrase();

  JAM.phrase.forEach(n=>A.lead(T+n.oct*12+MAJ[n.deg-1],t+n.p*spb/2,spb*.9,JAM.lead));

// In Sing, then play every 2-bar slot of a round uses the same two chords, so you sing and play over the changes you heard.
function jamChordIdx(bar,len){
  if(JAM.mode==="singplay") return (Math.floor(bar/8)*2+bar%2)%len;
  return bar%len;
}
function jamSched(){
  const ch=jamChords(); if(!ch.length) return; const spb=60/JAM.bpm;
  while(JAM.next<A.now+.12){
    const b=JAM.beat, bar=Math.floor(b/4), bi=b%4, ci=jamChordIdx(bar,ch.length), c=ch[ci], t=JAM.next;
    const v=voicing(c), phase=jamPhase(bar);

  }

/* ============ CHORD SHAPES ============ */
// frets low E -> high e (-1 = muted), fingers 0 = open/none. Open shapes are preferred; otherwise the lowest movable barre shape.
const OPEN_SHAPES={
  "0:maj":{f:[-1,3,2,0,1,0],g:[0,3,2,0,1,0]}, "9:maj":{f:[-1,0,2,2,2,0],g:[0,0,1,2,3,0]},
  "7:maj":{f:[3,2,0,0,0,3],g:[2,1,0,0,0,3]},  "4:maj":{f:[0,2,2,1,0,0],g:[0,2,3,1,0,0]},
  "2:maj":{f:[-1,-1,0,2,3,2],g:[0,0,0,1,3,2]},"9:min":{f:[-1,0,2,2,1,0],g:[0,0,2,3,1,0]},
  "4:min":{f:[0,2,2,0,0,0],g:[0,2,3,0,0,0]},  "2:min":{f:[-1,-1,0,2,3,1],g:[0,0,0,2,3,1]}
};
const MOVABLE={
  maj:[["E",r=>[r,r+2,r+2,r+1,r,r],[1,3,4,2,1,1]],["A",r=>[-1,r,r+2,r+2,r+2,r],[0,1,2,3,4,1]]],
  min:[["E",r=>[r,r+2,r+2,r,r,r],[1,3,4,1,1,1]],["A",r=>[-1,r,r+2,r+2,r+1,r],[0,1,3,4,2,1]]],
  dim:[["A",r=>[-1,r,r+1,r+2,r+1,-1],[0,1,2,4,3,0]],["E",r=>[r,r+1,r+2,r,-1,-1],[2,3,4,1,0,0]]]
};
function chordShapes(ch){
  const q=ch.iv[1]===3&&ch.iv[2]===6?"dim":ch.iv[1]===3?"min":"maj", out=[];
  const op=OPEN_SHAPES[ch.root+":"+q]; if(op) out.push({...op,how:"Open chord"});
  for(const [str,fn,g] of MOVABLE[q]){
    let r=((ch.root-(str==="E"?4:9))%12+12)%12;
    if(r===0&&op) r=12; // the open version already covers fret 0
    if(q!=="dim"&&r===0) continue;
    out.push({f:fn(r),g:r===0?g.map((x,i)=>fn(0)[i]<=0?0:x-1):g,how:q==="dim"?`Root on the ${str} string, fret ${r}`:`Barre at fret ${r} · ${str} shape`,fret:r});
  }
  // best first: open, then lowest position
  return out.sort((a,b)=>(a.how==="Open chord"?-1:0)-(b.how==="Open chord"?-1:0)||(a.fret??0)-(b.fret??0));
}
function shapeSVG(sh,rootPc){
  const W=132,H=140,x0=30,dx=18,y0=34,dy=21,fr=sh.f.filter(x=>x>0), maxF=Math.max(0,...fr), minF=fr.length?Math.min(...fr):1;
  const start=maxF<=5?1:minF; let g=`<svg class="cd" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=5;i++) g+=`<line class="fr" x1="${x0}" x2="${x0+5*dx}" y1="${y0+i*dy}" y2="${y0+i*dy}"/>`;
  if(start===1) g+=`<line class="nut" x1="${x0-1}" x2="${x0+5*dx+1}" y1="${y0}" y2="${y0}"/>`; else g+=`<text class="pos" x="${x0-11}" y="${y0+dy*.5}" text-anchor="end" dominant-baseline="central">${start}fr</text>`;
  for(let s=0;s<6;s++) g+=`<line class="str" x1="${x0+s*dx}" x2="${x0+s*dx}" y1="${y0}" y2="${y0+5*dy}"/>`;
  // barre: finger 1 on several strings at the same fret
  const ones=sh.f.map((f,i)=>sh.g[i]===1&&f>0?i:-1).filter(i=>i>=0), barre=ones.length>1&&ones.every(i=>sh.f[i]===sh.f[ones[0]]);
  if(barre){const a=Math.min(...ones),b=Math.max(...ones),y=y0+(sh.f[a]-start+.5)*dy; g+=`<rect class="dot" x="${x0+a*dx-8}" y="${y-8}" width="${(b-a)*dx+16}" height="16" rx="8"/><text class="fn" x="${x0+a*dx}" y="${y}">1</text>`;}
  sh.f.forEach((f,s)=>{
    const x=x0+s*dx, pc=(OPEN[5-s]+Math.max(f,0))%12;
    if(f<0) g+=`<text class="mk" x="${x}" y="${y0-9}">×</text>`;

  });

    <p class="muted" style="margin:0">The seven chords that belong to ${KEY_NAMES[k]} major, each with the easiest common fingering: an open chord where one exists, otherwise the lowest barre shape. Numbers on the dots are fingers (1 index, 4 pinky). Tap a diagram to hear it.</p>
    <div class="legend"><span><i style="background:var(--accent)"></i>root note</span><span><i style="background:var(--ink)"></i>other chord tone</span><span>○ open string</span><span>× don't play</span></div>
    <div class="shapes">${triads.map((ch,i)=>{const list=chordShapes(ch), idx=(CHORDUI.pick[ch.name]||0)%list.length, sh=list[idx];
      return `<div class="shape"><div class="hd"><b>${esc(ch.name)}</b><span>${esc(["I","ii","iii","IV","V","vi","vii°"][i])}</span></div>
        <div data-strum="${i}" aria-label="Play ${esc(ch.name)}">${shapeSVG(sh,ch.root)}</div>
        <div class="how">${esc(sh.how)}</div>
        ${list.length>1?`<button class="btn ghost alt" data-alt="${esc(ch.name)}">Other shape (${idx+1}/${list.length})</button>`:""}</div>`;}).join("")}</div>
    <div class="panel"><h3>Common progressions in ${KEY_NAMES[k]}</h3>
      <div class="secs">${["I V vi IV","I vi IV V","ii V I","I IV V"].map(l=>sectionHTML({name:l.replace(/ /g,"–"),nums:l},k)).join("")}</div>
      <p class="hint" style="margin:0">The same numbers work in every key. Change the key at the top and the chords and shapes follow.</p></div>`;
  $$("[data-strum]").forEach(b=>b.onclick=()=>{const ch=triads[+b.dataset.strum]; const list=chordShapes(ch); strumShape(list[(CHORDUI.pick[ch.name]||0)%list.length]);});
  $$("[data-alt]").forEach(b=>b.onclick=()=>{CHORDUI.pick[b.dataset.alt]=(CHORDUI.pick[b.dataset.alt]||0)+1; chordsView(el);});
}
VIEWS.tools.onMic=()=>{ if(S.tab==="tools"&&TOOLS.mode==="tune") render(); };
VIEWS.ear.onMic=()=>{ const h=$("#liveHint"); if(h) h.textContent=Mic.state==="on"?"Listening":"Turn on the mic in the header to check yourself"; };

/* ============ TONIC BUTTON (replaces the old drone) ============ */
function tonicBtnHTML(k){ return `<button class="btn" id="tonicBtn">Play tonic · ${KEY_NAMES[k]}</button>`; }
function bindTonic(){ const b=$("#tonicBtn"); if(b) b.onclick=()=>{ A.init(); A.pluck(tonicMidi(S.key),A.now+.03,.75,2); }; }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&S.ready&&S.keyDate!==today()){ render(); } if(document.hidden){ if(JAM.running){jamStop(); if(S.tab==="jam") render();} } });

/* ============ ROUTER ============ */
function render(){
  cleanup.forEach(f=>{try{f()}catch(e){}}); cleanup=[];
  ensureDailyKey();
  keySel.value=S.key;
  $$(".tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===S.tab)));
  VIEWS[S.tab].render();
}
function setTab(t){ if(S.tab==="jam"&&t!=="jam"&&JAM.running) jamStop(); if(S.tab==="tools"&&t!=="tools"&&TR.el) TR.el.pause(); S.tab=t; try{sessionStorage.setItem("e2f.tab",t)}catch(e){} render(); window.scrollTo(0,0); }
$$(".tabs button").forEach(b=>b.onclick=()=>{ if(b.dataset.tab==="songs"){SONGUI.adding=false;SONGUI.confirmDel=null;} if(b.dataset.tab!=="ear") S.focus=null; setTab(b.dataset.tab); });

(async function boot(){
  const h=(location.hash||"").slice(1); if(VIEWS[h]) S.tab=h;
  const local=Store.lsGet(); if(local&&local.state) applyState(local.state); if(local&&local.songs) SONGS=local.songs;
  render();
  await Store.init();
  const data=await Store.load();
  if(data.state) applyState(data.state);
  if(data.songs) SONGS=data.songs;
  if(Store.mode==="cloud"&&!data.state&&local&&local.state){ Store.saveState(); }
  S.ready=true;
  // one-time starter song for the vault
  if(!(S.seeded&&S.seeded.portPelegri)){
    S.seeded={...(S.seeded||{}),portPelegri:true};
    if(!SONGS.some(x=>/port pelegr/i.test(x.title))){ const song={id:"s-portpelegri",title:"Port Pelegrí",artist:"Guitarricadelafuente"}; SONGS.push(song); await Store.saveSong(song); }
    Store.saveState();
  }
  render();
})();
function applyState(st){
  if(typeof st.key==="number") S.key=st.key;
  if(st.seeded) S.seeded=st.seeded; if(st.songPick) S.songPick=st.songPick; if(Array.isArray(st.songHist)) S.songHist=st.songHist;
  if(st.keyDate) S.keyDate=st.keyDate; if(Array.isArray(st.keyHist)) S.keyHist=st.keyHist; if(typeof st.dailyKey==="boolean") S.dailyKey=st.dailyKey;
  if(st.stats){ S.stats={deg:st.stats.deg||{},prog:st.stats.prog||{c:0,n:0},sing:st.stats.sing||{c:0,n:0},echo:st.stats.echo||{c:0,n:0}}; }
  if(st.log) S.log=st.log; if(st.plan) S.plan=st.plan;
}
</script>
